# SPDX-License-Identifier: MIT
#
# CI workflow for W5500 ioLibrary_Driver
#
# Runs the full test suite, address/undefined-behaviour sanitizers,
# thread sanitizer, and C++ compatibility checks.
---
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang

      - name: Build and run test suite
        run: make -C tests clean all test

      - name: Run ASan / UBSan
        env:
          ASAN_OPTIONS: symbolize=0:detect_leaks=0
        run: make -C tests sanitize

      - name: Run TSan
        run: make -C tests tsan

      - name: C++ compatibility check
        run: |
          mkdir -p /tmp/opencode
          cat > /tmp/opencode/cpp_compat.cpp << 'CPP_EOF'
          #include <socket.h>
          #include <wizchip_conf.h>
          int main() { return 0; }
          CPP_EOF
          g++ -std=c++11 -c /tmp/opencode/cpp_compat.cpp \
            -I Ethernet -I Ethernet/W5500 \
            -D_WIZCHIP_=5500 -D_WIZCHIP_IO_MODE_=0x0203 \
            -o /tmp/opencode/cpp_compat.o
